<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    body { font: 13px/1.4 system-ui, sans-serif; width: 260px; margin: 12px; color: #16181d; }
    h1 { font-size: 15px; margin: 0 0 8px; }
    label { display: block; margin: 8px 0 4px; font-weight: 600; }
    input[type=text] { width: 100%; box-sizing: border-box; padding: 6px; }
    .row { display: flex; align-items: center; gap: 6px; }
    .note { color: #5d6470; font-size: 12px; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>FinProof</h1>
  <div class="row"><input id="enabled" type="checkbox"><label for="enabled" style="margin:0">Show the card on YouTube</label></div>
  <label for="backend">Backend address</label>
  <input id="backend" type="text">
  <p class="note">Checks the source of a stock tip. Not investment advice.</p>
  <script src="popup.js"></script>
</body>
</html>
